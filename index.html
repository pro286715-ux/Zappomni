<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Запомни — прототип</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap">
<style>
:root{--bg:#F4F3FB;--card:#fff;--ink:#1F2A5A;--mute:#6B7299;--acc:#FFC93C;--acc2:#6C5CE7;--mint:#CDEFE0;--line:#E3E1F2;--shadow:rgba(31,42,90,.12);--page:#E7E5F3}
:root:not([data-theme=light]){}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#14162A}}
:root[data-theme=dark]{--page:#14162A}
.phone[data-t=dark]{--bg:#161831;--card:#222546;--ink:#F1F0FF;--mute:#9EA3D1;--line:#33376A;--mint:#24493F;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--page);font-family:Nunito,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.phone{width:360px;height:740px;max-height:calc(100% - 20px);background:var(--bg);color:var(--ink);border-radius:34px;box-shadow:0 20px 60px var(--shadow);overflow:hidden;position:relative;display:flex;flex-direction:column;border:8px solid #0d0f22}
.status{height:26px;display:flex;justify-content:space-between;padding:6px 18px 0;font-size:12px;font-weight:800;flex:none}
.screen{flex:1;display:none;flex-direction:column;min-height:0}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:8px;padding:8px 16px 10px;flex:none}
.top h1{font-size:24px;font-weight:900;flex:1}
.body{flex:1;overflow-y:auto;padding:4px 16px 16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.ib{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:0 2px 6px var(--shadow);flex:none}
.ib.pri{background:var(--acc);color:#1F2A5A}
.ib svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 4px;flex:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800;color:var(--mute);padding:4px 0;border-radius:14px}
.nav button.on{color:var(--ink)}
.nav button.on svg{background:var(--acc);color:#1F2A5A;border-radius:12px;width:44px;padding:3px 11px;height:28px}
.gbar{height:18px;display:grid;place-items:center;flex:none;background:var(--card)}
.gbar i{width:96px;height:4px;border-radius:4px;background:var(--mute);opacity:.5}
.group{background:var(--card);border-radius:22px;padding:12px;margin-bottom:14px;box-shadow:0 4px 14px var(--shadow)}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gname{flex:1;font-size:17px;font-weight:900;border-radius:8px;padding:2px 6px;min-width:0}
.gname:focus{outline:2px dashed var(--acc2)}
.day{border:1.5px solid var(--line);border-radius:16px;padding:8px 10px;margin-top:8px}
.dhead{display:flex;align-items:center;justify-content:space-between;font-weight:800}
.dhead .ib{width:30px;height:30px;border-radius:10px;box-shadow:none;background:var(--bg)}
.dhead .ib svg{width:16px;height:16px}
.act{display:flex;align-items:center;gap:8px;margin-top:6px;padding:7px 10px;border-radius:12px;background:var(--mint);font-size:13px;font-weight:700}
.act b{margin-left:auto;font-weight:900;white-space:nowrap}
.act.pend{background:transparent;border:1.5px dashed var(--acc2)}
.badge{font-size:11px;font-weight:900;background:var(--acc);color:#1F2A5A;border-radius:8px;padding:2px 7px;white-space:nowrap}
.empty{color:var(--mute);font-size:13px;padding:6px 2px}
.note{margin-bottom:16px}
.nb{background:#FFE488;color:#3A3000;border-radius:18px;padding:10px 14px;box-shadow:0 4px 12px var(--shadow)}
.note:nth-child(2n) .nb{background:#D7D1FF;color:#221B5E}
.note:nth-child(3n) .nb{background:#BDEBD7;color:#103B2C}
.nb textarea{width:100%;border:0;background:repeating-linear-gradient(transparent 0 25px,rgba(0,0,0,.18) 25px 26px);font:inherit;font-weight:600;line-height:26px;color:inherit;resize:none;height:104px;outline:0}
.ntitle{display:block;width:100%;margin-top:6px;font:inherit;font-weight:900;color:var(--ink);background:none;border:0;padding:0 6px;font-size:15px}
.ava{border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:none}
.prof{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px;overflow-y:auto}
.prof .ava{width:150px;height:150px;font-size:60px;box-shadow:0 0 0 6px var(--acc),0 10px 26px var(--shadow)}
.nick{font-size:22px;font-weight:900;margin:18px 0 4px}
.sub{color:var(--mute);font-weight:600;font-size:14px}
.set{width:100%;margin-top:22px;background:var(--card);border-radius:20px;padding:4px 14px;box-shadow:0 4px 14px var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;font-weight:800}
.row+.row{border-top:1px solid var(--line)}
.sw{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw[aria-checked=true]{background:var(--acc2)}
.sw[aria-checked=true]::after{left:24px}
.sbar{display:flex;gap:8px;padding:0 16px 10px;flex:none}
.sbar input{flex:1;min-width:0;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 14px;font:inherit;font-weight:700;color:var(--ink)}
.pr{display:flex;align-items:center;gap:12px;background:var(--card);padding:10px 12px;border-radius:18px;margin-bottom:10px;width:100%;text-align:left;box-shadow:0 2px 8px var(--shadow)}
.pr .ava{width:46px;height:46px;font-size:19px}
.pr b{display:block}
.chead{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;border-bottom:1px solid var(--line);flex:none}
.chead .ava{width:40px;height:40px}
.chead b{flex:1;font-size:16px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--card);font-weight:600;font-size:14px;box-shadow:0 2px 6px var(--shadow)}
.m.me{align-self:flex-end;background:var(--acc2);color:#fff;border-bottom-right-radius:6px}
.m:not(.me){border-bottom-left-radius:6px}
.m.fire{background:var(--acc);color:#1F2A5A;font-weight:900}
.cin{display:flex;gap:8px;padding:8px 12px;flex:none;align-items:flex-end}
.cin input{flex:1;min-width:0;height:44px;border-radius:22px;border:2px solid var(--line);background:var(--card);padding:0 16px;font:inherit;font-weight:600;color:var(--ink)}
.cin .ib{border-radius:50%;width:44px;height:44px}
.splash{align-items:center;justify-content:space-between;padding:70px 0 60px;background:linear-gradient(var(--acc2),#3B2FA8);color:#fff;text-align:center}
.splash h2{font-size:38px;font-weight:900;margin-top:10px}
.splash p{font-weight:700;opacity:.9;padding:0 40px}
.mid{display:flex;flex-direction:column;align-items:center}
.scrim{position:absolute;inset:0;background:rgba(10,12,40,.5);display:none;align-items:flex-end;z-index:5}
.scrim.on{display:flex}
.sheet{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:18px 16px 24px;max-height:80%;overflow-y:auto}
.sheet h3{font-size:18px;font-weight:900;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:14px;background:var(--bg);font-weight:800;font-size:14px;border:2px solid transparent}
.chip.on{border-color:var(--acc2);background:var(--card)}
.sheet label{display:block;font-weight:800;font-size:13px;color:var(--mute);margin:14px 0 6px}
.sheet input{width:100%;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 12px;font:inherit;font-weight:700;color:var(--ink)}
.tm{display:flex;gap:10px;align-items:center}
.cta{margin-top:18px;width:100%;height:48px;border-radius:16px;background:var(--acc);color:#1F2A5A;font-weight:900;font-size:16px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:9;white-space:nowrap}
.toast.on{opacity:1}
.jump{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px;padding:0 10px}
.jump button{font-size:12px;font-weight:800;padding:5px 10px;border-radius:10px;background:var(--card);color:var(--ink)}
@media (max-width:420px){body{justify-content:flex-start}.phone{width:100%;max-height:none;height:100%;border-radius:0;border:0}}

:root{--bg:#000;--card:#161616;--ink:#fff;--mute:#8A8B91;--acc:#FE2C55;--acc2:#25F4EE;--mint:#1F1F1F;--line:#2A2A2A;--shadow:transparent}
.phone[data-t=dark]{--bg:#000;--card:#161616;--ink:#fff;--mute:#8A8B91;--mint:#1F1F1F;--line:#2A2A2A;--shadow:transparent}
.phone[data-t=light]{--bg:#fff;--card:#F1F1F2;--ink:#161823;--mute:#75767D;--mint:#F1F1F2;--line:#E3E3E4;--shadow:transparent}
body{background:#0b0b0b}
.phone{border-radius:28px;border-color:#1a1a1a;box-shadow:none}
.top h1{font-size:20px;font-weight:800}
.ib{border-radius:10px;box-shadow:none;background:var(--card)}
.ib.pri{background:var(--acc);color:#fff}
.group{border-radius:12px;box-shadow:none;border:1px solid var(--line);background:var(--bg)}
.day{border-radius:10px}
.dhead .ib{background:var(--card)}
.act{border-radius:8px;background:var(--card);border-left:3px solid var(--acc2)}
.act.pend{background:transparent;border:1px dashed var(--acc);border-left:3px solid var(--acc)}
.badge{background:var(--acc);color:#fff;border-radius:4px}
.nav{background:var(--bg);border-top:1px solid var(--line)}
.nav button.on svg{background:none;color:var(--ink);width:22px;height:22px;padding:0;border-radius:0}
.nav button.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--acc)}
.gbar{background:var(--bg)}
.note .nb,.note:nth-child(2n) .nb,.note:nth-child(3n) .nb{background:var(--card);color:var(--ink);border-radius:10px;box-shadow:none;border-left:3px solid var(--acc)}
.note:nth-child(2n) .nb{border-left-color:var(--acc2)}
.nb textarea{background:repeating-linear-gradient(transparent 0 25px,var(--line) 25px 26px)}
.pr{border-radius:10px;box-shadow:none}
.prof .ava{box-shadow:-4px 0 0 var(--acc2),4px 0 0 var(--acc)}
.set{border-radius:12px;box-shadow:none}
.sw[aria-checked=true]{background:var(--acc)}
.chip{border-radius:8px;background:var(--card)}
.chip.on{border-color:var(--ink);background:var(--card)}
.cta{border-radius:6px;background:var(--acc);color:#fff}
.sheet{background:var(--card);border-radius:16px 16px 0 0}
.sheet input,.sbar input,.cin input{border-radius:8px;border-color:transparent;background:var(--mint)}
.sbar input,.cin input{background:var(--card)}
.m{box-shadow:none;border-radius:14px}
.m.me{background:var(--acc);color:#fff}
.m.fire{background:var(--ink);color:var(--bg)}
.cin .ib{background:var(--acc);color:#fff}
.splash{background:#000}
.splash svg{filter:drop-shadow(-5px 0 0 #25F4EE) drop-shadow(5px 0 0 #FE2C55)}
.splash h2{text-shadow:-3px 0 #25F4EE,3px 0 #FE2C55}
.splash p{color:#8A8B91;opacity:1}
.toast{background:var(--ink);color:var(--bg)}
.jump button{background:#1f1f1f;color:#fff}
.gname:focus{outline-color:var(--acc2)}
.ghead .ib{width:34px;height:34px;border-radius:9px}.ghead .ib svg{width:18px;height:18px}.nrow{display:flex;align-items:center;gap:8px;margin-top:6px}.nrow .ntitle{margin:0;flex:1;min-width:0}.nrow .ib{width:34px;height:34px}
@media (max-width:420px){.status{display:none}.phone{height:100dvh}body{padding:0}}
button{-webkit-tap-highlight-color:transparent}
</style></head>
<body>
<div class="phone" id="ph" data-t="dark">
 <div class="status"><span>9:41</span><span>● ▲ ▮</span></div>

 <section class="screen splash on" id="s-splash">
  <span></span>
  <div class="mid">
   <svg width="190" height="190" viewBox="0 0 190 190" aria-label="Маскот Запомни">
    <ellipse cx="95" cy="176" rx="50" ry="8" fill="#000" opacity=".18"/>
    <path d="M70 34c-10-14-30-10-30 4 0 10 20 10 30 2 10 8 30 8 30-2 0-14-20-18-30-4z" fill="#25F4EE" transform="translate(25 -4)"/>
    <circle cx="95" cy="36" r="9" fill="#FE2C55"/>
    <path d="M30 48h130v102l-28 24H30z" fill="#fff"/>
    <path d="M132 174v-24h28z" fill="#BDBDBD"/>
    <circle cx="68" cy="92" r="11" fill="#1F2A5A"/><circle cx="122" cy="92" r="11" fill="#1F2A5A"/>
    <circle cx="71" cy="88" r="4" fill="#fff"/><circle cx="125" cy="88" r="4" fill="#fff"/>
    <circle cx="52" cy="116" r="8" fill="#FE2C55" opacity=".55"/><circle cx="138" cy="116" r="8" fill="#FE2C55" opacity=".55"/>
    <path d="M80 114q15 16 30 0" stroke="#1F2A5A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M30 100q-14 6-14 20" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M160 100q14 6 14 20" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/>
   </svg>
   <h2>Запомни</h2>
  </div>
  <p>Всё важное — вовремя и без лишних уведомлений</p>
 </section>

 <section class="screen" id="s-home"></section>
 <section class="screen" id="s-notes"></section>
 <section class="screen" id="s-shared"></section>
 <section class="screen" id="s-search"></section>
 <section class="screen" id="s-me"></section>
 <section class="screen" id="s-prof"></section>
 <section class="screen" id="s-chat"></section>

 <div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
 <div class="toast" id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const I={
home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
note:'<path d="M5 3h10l4 4v14H5z"/><path d="M9 11h6M9 15h6"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14c2.5.6 3.5 2.6 3.5 6"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
print:'<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><path d="M7 14h10v7H7z"/>',
chat:'<path d="M4 5h16v11H9l-5 4z"/>',
back:'<path d="M15 5l-7 7 7 7"/>',
send:'<path d="M3 11l18-8-8 18-2-8z"/>',
trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
flame:'<path d="M12 22c4 0 7-2.8 7-7 0-3-2-5-3.5-7-.3 2-1.2 3-2.5 3 .5-3-1-6-4-8 .2 3.5-4 5.5-4 11 0 4.2 3 8 7 8z"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const ava=(t,c,s)=>`<div class="ava" style="background:${c};width:${s||46}px;height:${s||46}px;font-size:${(s||46)*.4}px">${t}</div>`;
const DAYS=['Весь день','Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const ACTS=['Не беспокоить','Беззвучный','Открыть ссылку','Открыть приложение','Блокировка телефона'];
const P=[{n:'Аня Лебедева',k:'@anya_leb',c:'#E5547A'},{n:'Максим Орлов',k:'@max_orlov',c:'#2BA38A'},{n:'Даша Ким',k:'@dasha.kim',c:'#4F7BEA'},{n:'Илья Ветров',k:'@ilya_v',c:'#E58A2B'}];
const S={
 home:[{name:'Учёба',days:[{d:'Пн',a:[{t:'Не беспокоить',f:'09:00',to:'13:00'},{t:'Беззвучный',f:'13:00',to:'14:00'}]},{d:'Ср',a:[{t:'Блокировка телефона',f:'18:00',to:'20:00'}]}]}],
 shared:[{name:'Режим с Аней',days:[{d:'Вт',a:[{t:'Не беспокоить',f:'19:00',to:'21:00'}]}]}],
 notes:[{title:'Купить',text:'молоко\nхлеб\nкофе'},{title:'Идеи на выходные',text:'парк\nкино'}],
 msgs:[{me:0,t:'Привет! Давай вместе настроим вечер вторника'},{me:1,t:'Давай, добавила режим «Не беспокоить»'}],
 notif:true,theme:'dark',cur:'splash',prof:0};
try{const z=JSON.parse(localStorage.getItem('zp')||'null');if(z){Object.assign(S,z);S.cur='splash';}}catch(e){}
$('#ph').dataset.t=S.theme;
const save=()=>{try{localStorage.setItem('zp',JSON.stringify({home:S.home,shared:S.shared,notes:S.notes,msgs:S.msgs,notif:S.notif,theme:S.theme}))}catch(e){}};
const tabs=[['home','Главная','home'],['notes','Заметки','note'],['shared','Вместе','users'],['search','Поиск','search'],['me','Профиль','user']];
const nav=a=>`<nav class="nav">${tabs.map(t=>`<button data-go="${t[0]}" class="${t[0]==a?'on':''}">${ic(t[2])}${t[1]}</button>`).join('')}</nav><div class="gbar"><i></i></div>`;
const hdr=(title,btns)=>`<div class="top"><h1>${title}</h1>${btns}</div>`;
const actHtml=(a,gi,di,ai,sh)=>`<div class="act ${a.p?'pend':''}">${a.t}${a.v?` · ${a.v}`:''}<b>${a.f}–${a.to}</b>${a.p?`<button class="badge" data-ok="${gi}.${di}.${ai}">ждём Аню</button>`:''}</div>`;
function groups(key,sh){const g=S[key];if(!g.length)return '<p class="empty">Групп пока нет. Нажмите плюс, чтобы добавить.</p>';
 return g.map((x,gi)=>`<div class="group"><div class="ghead"><div class="gname" contenteditable="true" spellcheck="false" data-gn="${key}.${gi}" aria-label="Название группы">${x.name}</div>
 ${key=='shared'?`<button class="ib" data-chat aria-label="Чат с Аней">${ic('chat')}</button>`:''}<button class="ib" data-print aria-label="Скачать фото расписания">${ic('print')}</button><button class="ib" data-delgrp="${key}.${gi}" aria-label="Удалить группу">${ic('trash')}</button><button class="ib pri" data-addday="${key}.${gi}" aria-label="Добавить день">${ic('plus')}</button></div>
 ${x.days.length?x.days.map((d,di)=>`<div class="day"><div class="dhead">${d.d}${d.p?'<span class="badge">ждём Аню</span>':''}<button class="ib" data-addact="${key}.${gi}.${di}" aria-label="Добавить действие">${ic('plus')}</button></div>
 ${d.a.length?d.a.map((a,ai)=>actHtml(a,key+'.'+gi,di,ai)).join(''):'<div class="empty">Добавьте действие</div>'}</div>`).join(''):'<div class="empty">Добавьте день недели или весь день</div>'}</div>`).join('');}
function render(){
 $('#s-home').innerHTML=hdr('Главная',`<button class="ib pri" data-addgrp="home" aria-label="Добавить группу">${ic('plus')}</button>`)+`<div class="body">${groups('home')}</div>`+nav('home');
 $('#s-shared').innerHTML=hdr('Вместе',`<button class="ib pri" data-addgrp="shared" aria-label="Добавить группу">${ic('plus')}</button>`)+`<div class="body"><p class="sub" style="margin:0 4px 12px">Новые дни и действия вступают в силу после подтверждения Ани</p>${groups('shared')}</div>`+nav('shared');
 $('#s-notes').innerHTML=hdr('Заметки',`<button class="ib pri" data-addnote aria-label="Добавить заметку">${ic('plus')}</button>`)+`<div class="body">${S.notes.length?'':'<p class="empty">Заметок пока нет. Нажмите плюс, чтобы добавить.</p>'}${S.notes.map((n,i)=>`<div class="note"><div class="nb"><textarea data-nt="${i}" aria-label="Текст заметки">${n.text}</textarea></div><div class="nrow"><input class="ntitle" data-ntt="${i}" value="${n.title}" aria-label="Название заметки"><button class="ib" data-delnote="${i}" aria-label="Удалить заметку">${ic('trash')}</button></div></div>`).join('')}</div>`+nav('notes');
 $('#s-search').innerHTML=hdr('Поиск','')+`<div class="sbar"><input id="q" placeholder="Ник или имя" aria-label="Поиск"><button class="ib pri" data-dosearch aria-label="Искать">${ic('search')}</button></div><div class="body" id="res"></div>`+nav('search');
 res('');
 const me=`<div class="prof">${ava('В','#6C5CE7',150)}<div class="nick">@vika_zapomni</div><div class="sub">Вика · с вами с марта</div>`;
 $('#s-me').innerHTML=hdr('Профиль','')+me+`<div class="set"><div class="row">Уведомления<button class="sw" role="switch" aria-checked="${S.notif}" data-sw="notif" aria-label="Уведомления"></button></div><div class="row">Тёмная тема<button class="sw" role="switch" aria-checked="${S.theme=='dark'}" data-sw="theme" aria-label="Тёмная тема"></button></div></div></div>`+nav('me');
 const p=P[S.prof];
 $('#s-prof').innerHTML=`<div class="top"><button class="ib" data-go="search" aria-label="Назад">${ic('back')}</button><h1>Профиль</h1></div><div class="prof">${ava(p.n[0],p.c,150)}<div class="nick">${p.k}</div><div class="sub">${p.n}</div><button class="cta" style="max-width:240px" data-togroup>Создать группу вместе</button></div>`+nav('search');
 $('#s-chat').innerHTML=`<div class="chead"><button class="ib" data-go="shared" aria-label="Выйти из чата">${ic('back')}</button>${ava('А',P[0].c,40)}<b>${P[0].k}</b><button class="ib pri" data-fire aria-label="Предложить огонёк">${ic('flame')}</button></div><div class="msgs" id="msgs">${S.msgs.map(m=>`<div class="m ${m.me?'me':''} ${m.f?'fire':''}">${m.t}</div>`).join('')}</div><div class="cin"><input id="ci" placeholder="Сообщение" aria-label="Сообщение"><button class="ib pri" data-send aria-label="Отправить">${ic('send')}</button></div><div class="gbar"><i></i></div>`;
 const m=$('#msgs');m.scrollTop=m.scrollHeight;save();
}
function res(q){q=q.toLowerCase();const l=P.map((p,i)=>[p,i]).filter(([p])=>!q||(p.n+p.k).toLowerCase().includes(q));
 $('#res').innerHTML=l.length?l.map(([p,i])=>`<button class="pr" data-prof="${i}">${ava(p.n[0],p.c)}<span><b>${p.n}</b><span class="sub">${p.k}</span></span></button>`).join(''):'<p class="empty">Никого не нашли. Проверьте ник.</p>';}
function go(s){S.cur=s;if(s=='splash'){clearTimeout(go.t);go.t=go('splash');
let hid=false;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=true;else if(hid){hid=false;closeSheet();go('splash');}});
addEventListener('pageshow',e=>{if(e.persisted){closeSheet();go('splash');}});}document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id=='s-'+s));if(s=='search')res('');}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800);}
function sheet(h){$('#sheet').innerHTML=h;$('#scrim').classList.add('on');}
function closeSheet(){$('#scrim').classList.remove('on');}
const ref=(k,i)=>S[k][i];
let pick={};
document.addEventListener('click',e=>{
 const t=e.target.closest('button,.chip,.scrim');if(!t)return;
 const d=t.dataset;
 if(t.classList.contains('scrim')&&e.target==t){closeSheet();return;}
 const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
 const ask=(h,sub)=>sheet(`<h3>${h}</h3><p class="sub">${sub}</p><button class="cta" data-confdel>Удалить</button><button class="cta" style="background:var(--mint);color:var(--ink);margin-top:8px" data-cancel>Отмена</button>`);
 if(d.delgrp){pick={del:d.delgrp};const[k,i]=d.delgrp.split('.');ask('Удалить группу «'+esc(S[k][i].name)+'»?','Все дни и действия внутри пропадут.');return;}
 if(d.delnote!==undefined){pick={dn:+d.delnote};ask('Удалить заметку «'+esc(S.notes[d.delnote].title)+'»?','Текст заметки пропадёт.');return;}
 if(d.cancel!==undefined){closeSheet();return;}
 if(d.confdel!==undefined){let back='home';if(pick.del){const[k,i]=pick.del.split('.');S[k].splice(i,1);back=k;toast('Группа удалена');}else{S.notes.splice(pick.dn,1);back='notes';toast('Заметка удалена');}closeSheet();render();go(back);return;}
 if(d.go){go(d.go);return;}
 if(d.chat){go('chat');return;}
 if(d.prof!==undefined){S.prof=+d.prof;render();go('prof');return;}
 if(d.print!==undefined){toast('Фото расписания сохранено');return;}
 if(d.sw){if(d.sw=='notif'){S.notif=!S.notif;toast(S.notif?'Уведомления включены':'Уведомления выключены')}else{S.theme=S.theme=='dark'?'light':'dark';$('#ph').dataset.t=S.theme;}render();go('me');return;}
 if(d.addgrp){S[d.addgrp].push({name:'Новая группа',days:[]});render();go(d.addgrp);return;}
 if(d.addnote!==undefined){S.notes.unshift({title:'Название',text:''});render();go('notes');return;}
 if(d.addday){pick={k:d.addday,v:null};sheet(`<h3>Добавить в группу</h3><div class="chips">${DAYS.map(x=>`<button class="chip" data-d="${x}">${x}</button>`).join('')}</div><button class="cta" data-confirmday>Добавить</button>`);return;}
 if(d.d){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c==t));pick.v=d.d;return;}
 if(d.confirmday!==undefined){if(!pick.v)return toast('Выберите день');const[k,gi]=pick.k.split('.');S[k][gi].days.push({d:pick.v,a:[],p:k=='shared'});closeSheet();render();go(k);return;}
 if(d.addact){pick={k:d.addact,v:ACTS[0]};sheet(`<h3>Новое действие</h3><div class="chips">${ACTS.map((x,i)=>`<button class="chip ${i?'':'on'}" data-at="${x}">${x}</button>`).join('')}</div><div id="ex"></div><label>Время</label><div class="tm"><input id="tf" type="time" value="09:00" aria-label="С"><span>—</span><input id="tt" type="time" value="10:00" aria-label="До"></div><button class="cta" data-confirmact>Добавить действие</button>`);return;}
 if(d.at){pick.v=d.at;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c==t));$('#ex').innerHTML=d.at=='Открыть ссылку'?'<label>Ссылка</label><input id="xv" placeholder="https://">':d.at=='Открыть приложение'?'<label>Приложение</label><input id="xv" placeholder="Например, Календарь">':'';return;}
 if(d.confirmact!==undefined){const[k,gi,di]=pick.k.split('.');const x=$('#xv');S[k][gi].days[di].a.push({t:pick.v,v:x?x.value:'',f:$('#tf').value,to:$('#tt').value,p:k=='shared'});closeSheet();render();go(k);if(k=='shared')toast('Отправлено Ане на подтверждение');return;}
 if(d.ok){const[k,gi,di,ai]=d.ok.split('.');S[k][gi].days[di].a[ai].p=false;S[k][gi].days[di].p=false;render();go('shared');toast('Аня подтвердила');return;}
 if(d.dosearch!==undefined){res($('#q').value);return;}
 if(d.togroup!==undefined){toast('Приглашение отправлено');return;}
 if(d.send!==undefined){const v=$('#ci').value.trim();if(!v)return;S.msgs.push({me:1,t:v});render();go('chat');return;}
 if(d.fire!==undefined){S.msgs.push({me:1,f:1,t:'🔥 Предлагаю огонёк: серия дней вместе'});render();go('chat');return;}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id=='q')res(t.value);
 if(t.dataset.nt)S.notes[t.dataset.nt].text=t.value;
 if(t.dataset.ntt)S.notes[t.dataset.ntt].title=t.value;save();});
document.addEventListener('focusout',e=>{const g=e.target.dataset&&e.target.dataset.gn;if(g){const[k,i]=g.split('.');S[k][i].name=e.target.textContent.trim()||'Группа';save();}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ci')document.querySelector('[data-send]').click();if(e.key=='Enter'&&e.target.dataset.gn){e.preventDefault();e.target.blur();}});
render();
setTimeout(()=>{if(S.cur=='splash')go('home')},2600);
</script>
</body></html>
